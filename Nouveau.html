<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3a4f">
<title>Risque de givre</title>
<style>
  :root {
    --bg1: #3a4a60; --bg2: #26323f; --accent: #ffffff;
  }
  body[data-level="0"] { --bg1: #f8e3a3; --bg2: #efc673; }
  body[data-level="1"] { --bg1: #86a8e6; --bg2: #5273b8; }
  body[data-level="2"] { --bg1: #a893d6; --bg2: #6f5aa8; }
  body[data-level="3"] { --bg1: #e58a7b; --bg2: #aa4d47; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
    transition: background 0.6s ease;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  body[data-level="0"] { color: #4a3a15; }

  .app { max-width: 460px; margin: 0 auto; padding: 24px 0 40px; }

  header { text-align: center; }
  .place { font-size: 20px; opacity: 0.9; letter-spacing: 0.02em; min-height: 26px; }

  .env-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 14px auto 0; padding: 10px 18px;
    background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px; color: inherit; font-size: 15px; font-family: inherit; cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .env-btn b { font-weight: 600; }
  .env-btn .chev { opacity: 0.7; font-size: 18px; line-height: 1; }

  .hero { text-align: center; padding: 40px 8px 28px; }
  .icon { height: 96px; max-width: 100%; margin: 0 auto 24px; display: block; }
  .when { font-size: 19px; opacity: 0.85; margin-bottom: 8px; }
  .when::first-letter { text-transform: uppercase; }
  .verdict { font-size: 32px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
  .credit { margin-top: 16px; font-size: 12px; line-height: 1.4; opacity: 0.7; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .card {
    background: rgba(255,255,255,0.18); border-radius: 20px; padding: 16px 18px;
    backdrop-filter: blur(10px);
  }
  .card .label { font-size: 13px; opacity: 0.75; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .card-title { grid-column: 1 / -1; font-size: 13px; opacity: 0.75; margin: 4px 4px 0; }

  .strip {
    margin-top: 12px; background: rgba(255,255,255,0.18); border-radius: 20px;
    padding: 16px 18px; display: flex; justify-content: space-between; backdrop-filter: blur(10px);
  }
  .strip div { text-align: center; font-size: 13px; }
  .strip b { display: block; font-size: 17px; font-weight: 600; margin-top: 4px; }

  .days-title { font-size: 13px; opacity: 0.75; margin: 28px 4px 8px; }
  .days { display: flex; flex-direction: column; gap: 8px; }
  .day {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-radius: 16px; font-size: 17px;
    color: #fff; border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .day .risk-text { margin-left: auto; font-size: 13px; opacity: 0.9; text-align: right; }
  .day[data-level="0"] { background: linear-gradient(135deg, #f8e3a3, #efc673); color: #4a3a15; border-color: rgba(74,58,21,0.2); }
  .day[data-level="1"] { background: linear-gradient(135deg, #86a8e6, #5273b8); }
  .day[data-level="2"] { background: linear-gradient(135deg, #a893d6, #6f5aa8); }
  .day[data-level="3"] { background: linear-gradient(135deg, #e58a7b, #aa4d47); }
  .day svg { display: block; flex-shrink: 0; }

  .status { text-align: center; padding: 100px 20px; font-size: 18px; opacity: 0.9; }
  .source { text-align: center; font-size: 11px; opacity: 0.6; margin-top: 28px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; background: #fff; color: #222;
    border-radius: 28px 28px 0 0; padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.35s ease; max-width: 460px; margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet h2 { font-size: 20px; margin-bottom: 6px; }
  .sheet p { font-size: 14px; color: #666; margin-bottom: 16px; line-height: 1.4; }
  .opt {
    display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 8px;
    border: 2px solid #e5e5ea; border-radius: 14px; background: #fff; font-size: 16px; color: #222; cursor: pointer;
    font-family: inherit;
  }
  .opt small { display: block; color: #888; font-size: 13px; margin-top: 2px; }
  .opt.selected { border-color: #4b6cf0; background: #f1f4ff; }
</style>
</head>
<body data-level="none">
<div class="app">
  <header>
    <div class="place" id="place"></div>
    <button class="env-btn" id="envBtn" aria-label="Choisir votre environnement">
      <span>Mon environnement : <b id="envLabel">zone boisée</b></span>
      <span class="chev">›</span>
    </button>
  </header>

  <div id="content">
    <div class="status" id="message">Analyse du risque de givre en cours…</div>
  </div>

  <div class="source">Données météo : MET Norway</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <h2>Votre environnement</h2>
  <p>Le givre se forme plus facilement selon l'endroit où vous habitez. Choisissez ce qui correspond le mieux à votre zone.</p>
  <button class="opt" data-env="general">Général<small>Aucun ajustement</small></button>
  <button class="opt" data-env="wooded">Zone boisée<small>Plus frais et plus humide</small></button>
  <button class="opt" data-env="urban">Zone urbaine<small>Plus doux et plus sec</small></button>
