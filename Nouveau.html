<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3a4f">
<title>Risque de givre</title>
<style>
  :root {
    --bg1: #3a4a60; --bg2: #26323f; --accent: #ffffff;
  }
  body[data-level="0"] { --bg1: #f8e3a3; --bg2: #efc673; }
  body[data-level="1"] { --bg1: #86a8e6; --bg2: #5273b8; }
  body[data-level="2"] { --bg1: #a893d6; --bg2: #6f5aa8; }
  body[data-level="3"] { --bg1: #e58a7b; --bg2: #aa4d47; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
    transition: background 0.6s ease;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  body[data-level="0"] { color: #4a3a15; }

  .app { max-width: 460px; margin: 0 auto; padding: 24px 0 40px; }

  header { text-align: center; }
  .place { font-size: 20px; opacity: 0.9; letter-spacing: 0.02em; min-height: 26px; }

  .env-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 14px auto 0; padding: 10px 18px;
    background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px; color: inherit; font-size: 15px; font-family: inherit; cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .env-btn b { font-weight: 600; }
  .env-btn .chev { opacity: 0.7; font-size: 18px; line-height: 1; }

  .hero { text-align: center; padding: 40px 8px 28px; }
  .icon { height: 96px; max-width: 100%; margin: 0 auto 24px; display: block; }
  .when { font-size: 19px; opacity: 0.85; margin-bottom: 8px; }
  .when::first-letter { text-transform: uppercase; }
  .verdict { font-size: 32px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
  .credit { margin-top: 16px; font-size: 12px; line-height: 1.4; opacity: 0.7; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .card {
    background: rgba(255,255,255,0.18); border-radius: 20px; padding: 16px 18px;
    backdrop-filter: blur(10px);
  }
  .card .label { font-size: 13px; opacity: 0.75; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .card-title { grid-column: 1 / -1; font-size: 13px; opacity: 0.75; margin: 4px 4px 0; }

  .strip {
    margin-top: 12px; background: rgba(255,255,255,0.18); border-radius: 20px;
    padding: 16px 18px; display: flex; justify-content: space-between; backdrop-filter: blur(10px);
  }
  .strip div { text-align: center; font-size: 13px; }
  .strip b { display: block; font-size: 17px; font-weight: 600; margin-top: 4px; }

  .days-title { font-size: 13px; opacity: 0.75; margin: 28px 4px 8px; }
  .days { display: flex; flex-direction: column; gap: 8px; }
  .day {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-radius: 16px; font-size: 17px;
    color: #fff; border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .day .risk-text { margin-left: auto; font-size: 13px; opacity: 0.9; text-align: right; }
  .day[data-level="0"] { background: linear-gradient(135deg, #f8e3a3, #efc673); color: #4a3a15; border-color: rgba(74,58,21,0.2); }
  .day[data-level="1"] { background: linear-gradient(135deg, #86a8e6, #5273b8); }
  .day[data-level="2"] { background: linear-gradient(135deg, #a893d6, #6f5aa8); }
  .day[data-level="3"] { background: linear-gradient(135deg, #e58a7b, #aa4d47); }
  .day svg { display: block; flex-shrink: 0; }

  .status { text-align: center; padding: 100px 20px; font-size: 18px; opacity: 0.9; }
  .source { text-align: center; font-size: 11px; opacity: 0.6; margin-top: 28px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; background: #fff; color: #222;
    border-radius: 28px 28px 0 0; padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.35s ease; max-width: 460px; margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet h2 { font-size: 20px; margin-bottom: 6px; }
  .sheet p { font-size: 14px; color: #666; margin-bottom: 16px; line-height: 1.4; }
  .opt {
    display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 8px;
    border: 2px solid #e5e5ea; border-radius: 14px; background: #fff; font-size: 16px; color: #222; cursor: pointer;
    font-family: inherit;
  }
  .opt small { display: block; color: #888; font-size: 13px; margin-top: 2px; }
  .opt.selected { border-color: #4b6cf0; background: #f1f4ff; }
</style>
</head>
<body data-level="none">
<div class="app">
  <header>
    <div class="place" id="place"></div>
    <button class="env-btn" id="envBtn" aria-label="Choisir votre environnement">
      <span>Mon environnement : <b id="envLabel">zone boisée</b></span>
      <span class="chev">›</span>
    </button>
  </header>

  <div id="content">
    <div class="status" id="message">Analyse du risque de givre en cours…</div>
  </div>

  <div class="source">Données météo : MET Norway</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <h2>Votre environnement</h2>
  <p>Le givre se forme plus facilement selon l'endroit où vous habitez. Choisissez ce qui correspond le mieux à votre zone.</p>
  <button class="opt" data-env="general">Général<small>Aucun ajustement</small></button>
  <button class="opt" data-env="wooded">Zone boisée<small>Plus frais et plus humide</small></button>
  <button class="opt" data-env="urban">Zone urbaine<small>Plus doux et plus sec</small></button>
  <button class="opt" data-env="rural">Zone rurale<small>Un peu plus frais</small></button>
</div>

<script>
// Affiche à l'écran toute erreur de script (au lieu d'une page figée)
window.addEventListener("error", function (e) {
  var c = document.getElementById("content");
  if (c) c.innerHTML = '<div class="status">⚠️ Erreur : ' + e.message + "</div>";
});

// ---------- Réglages ----------
const NB_JOURS_SUIVANTS = 6;

const ENVIRONMENTS = {
  general: { name: "Général",      short: "général",      temp: 0,    hum: 0  },
  wooded:  { name: "Zone boisée",  short: "zone boisée",  temp: -1.5, hum: 5  },
  urban:   { name: "Zone urbaine", short: "zone urbaine", temp: 0.5,  hum: -5 },
  rural:   { name: "Zone rurale",  short: "zone rurale",  temp: -1.0, hum: 0  }
};

let currentEnv = "wooded";
try {
  const saved = localStorage.getItem("givre_env");
  if (saved && ENVIRONMENTS[saved]) currentEnv = saved;
} catch (e) {}

let state = { days: [], city: "" };

function updatePill() {
  document.getElementById("envLabel").textContent = ENVIRONMENTS[currentEnv].short;
}

// ---------- Démarrage ----------
window.addEventListener("load", function () {
  setupSheet();
  updatePill();
  showMessage("Localisation en cours…");
  if (!navigator.geolocation) {
    showMessage("La géolocalisation n'est pas supportée par votre navigateur.");
    return;
  }
  navigator.geolocation.getCurrentPosition(onPosition, function (err) {
    let msg = "⚠️ Impossible de récupérer votre position.";
    if (err && err.code === 1) msg = "⚠️ Localisation refusée. Activez-la dans les réglages, puis rechargez la page.";
    if (err && err.code === 2) msg = "⚠️ Position indisponible. Vérifiez votre GPS.";
    if (err && err.code === 3) msg = "⚠️ Temps d'attente dépassé. Rechargez la page.";
    showMessage(msg);
  }, { enableHighAccuracy: false, timeout: 30000, maximumAge: 60000 });
});

function showMessage(text) {
  document.getElementById("content").innerHTML = '<div class="status">' + text + "</div>";
}

function onPosition(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;

  showMessage("Récupération des données météo…");

  // Le nom de la ville arrive quand il arrive, sans bloquer la météo
  getCityName(lat, lon, function (city) {
    state.city = city;
    document.getElementById("place").textContent = "📍 " + city;
  });

  const url = "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=" +
    lat.toFixed(4) + "&lon=" + lon.toFixed(4);
  fetch(url)
    .then(function (r) {
      if (!r.ok) throw new Error("service météo indisponible (" + r.status + ")");
      return r.json();
    })
    .then(processWeather)
    .catch(function (err) {
      showMessage("⚠️ Erreur météo : " + err.message);
    });
}

function getCityName(lat, lon, callback) {
  const url = "https://nominatim.openstreetmap.org/reverse?lat=" + lat + "&lon=" + lon + "&format=json&zoom=10";
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, 5000);
  fetch(url, { signal: ctrl.signal })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      clearTimeout(timer);
      const a = (d && d.address) || {};
      callback(a.city || a.town || a.village || a.municipality || "Votre position");
    })
    .catch(function () { clearTimeout(timer); callback("Votre position"); });
}

// ---------- Données météo ----------
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function processWeather(data) {
  if (!data.properties || !data.properties.timeseries || !data.properties.timeseries.length) {
    showMessage("⚠️ Données météo non disponibles.");
    return;
  }

  const series = data.properties.timeseries;
  const days = [];

  for (let i = 1; i <= 1 + NB_JOURS_SUIVANTS; i++) {
    const day = new Date();
    day.setDate(day.getDate() + i);
    day.setHours(0, 0, 0, 0);

    const night = series.filter(function (item) {
      const d = new Date(item.time);
      return sameDay(d, day) && d.getHours() >= 2 && d.getHours() <= 8;
    }).sort(function (a, b) { return new Date(a.time) - new Date(b.time); });

    if (night.length) {
      days.push({ date: day, forecast: night });
    } else if (i === 1) {
      showMessage("⚠️ Aucune prévision disponible pour demain matin.");
      return;
    }
  }

  state.days = days;
  render();
}

// ---------- Évaluation du risque (point de rosée + nuages) ----------
function cloudOf(item) {
  const d = item.data.instant.details;
  const n1 = item.data.next_1_hours && item.data.next_1_hours.details
    ? item.data.next_1_hours.details.cloud_area_fraction : undefined;
  return n1 !== undefined && n1 !== null ? n1 : d.cloud_area_fraction;
}

function assessRisk(forecast) {
  const env = ENVIRONMENTS[currentEnv];
  let level = 0;

  forecast.forEach(function (item) {
    const d = item.data.instant.details;
    const temp = d.air_temperature + env.temp;
    const hum = Math.min(100, d.relative_humidity + env.hum);
    const wind = d.wind_speed * 3.6;

    const b = 17.27, c = 237.7;
    const alpha = (b * temp) / (c + temp) + Math.log(hum / 100);
    const dew = (c * alpha) / (b - alpha);

    const cloud = cloudOf(item);

    if (temp <= 0 && dew >= temp - 1 && (cloud === undefined || cloud < 30)) {
      level = 3;
    } else if (temp <= 1 && dew >= temp - 2 && (cloud === undefined || cloud < 50)) {
      level = Math.max(level, 2);
    } else if (temp <= 2.5 && dew >= temp - 2 && wind <= 10 && (cloud === undefined || cloud < 70)) {
      level = Math.max(level, 1);
    }
  });
  return { level: level };
}

// ---------- Affichage ----------
const VERDICTS = {
  0: "Pas de risque de givre",
  1: "Risque potentiel de givre",
  2: "Risque important de givre",
  3: "Alerte givre"
};

const LEVEL_LABELS = {
  0: "pas de risque",
  1: "risque potentiel",
  2: "risque important",
  3: "alerte givre"
};

// Un flocon, dessiné dans une case de 24x24
const FLAKE_PATH = "M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9 5l3 3 3-3M9 19l3-3 3 3";

// Grand pictogramme du verdict (hauteur 96, largeur variable selon le niveau)
function iconSvg(level) {
  const head = function (w) {
    return '<svg class="icon" width="' + w + '" height="96" viewBox="0 0 ' + w + ' 96" fill="none" ' +
      'stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" ' +
      'role="img" aria-label="' + LEVEL_LABELS[level] + '">';
  };
  const bigFlake = function (x) {
    return '<g transform="translate(' + x + ' 0) scale(4)" stroke-width="1.3"><path d="' + FLAKE_PATH + '"/></g>';
  };

  if (level === 0) {
    return head(96) +
      '<circle cx="48" cy="48" r="16" fill="currentColor"/>' +
      '<path d="M48 12v10M48 74v10M12 48h10M74 48h10M22.5 22.5l7 7M66.5 66.5l7 7M22.5 73.5l7-7M66.5 29.5l7-7"/></svg>';
  }
  if (level === 1) {
    return head(96) + bigFlake(0) + "</svg>";
  }
  if (level === 2) {
    return head(204) + bigFlake(0) + bigFlake(108) + "</svg>";
  }
  // Alerte : deux flocons avec un panneau danger au milieu
  return head(288) + bigFlake(0) + bigFlake(192) +
    '<path d="M144 14L180 80H108Z"/>' +
    '<path d="M144 36v22"/>' +
    '<path d="M144 69h.01"/></svg>';
}

// Petits pictogrammes pour la liste des jours
function flake(x) {
  return '<g transform="translate(' + x + ' 0)"><path d="' + FLAKE_PATH + '"/></g>';
}

function dayIcon(level) {
  const open = function (w) {
    return '<svg width="' + w + '" height="26" viewBox="0 0 ' + w + ' 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="' + LEVEL_LABELS[level] + '">';
  };
  if (level === 0) {
    return open(24) +
      '<circle cx="12" cy="12" r="4.5" fill="currentColor"/>' +
      '<path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>';
  }
  if (level === 1) {
    return open(24) + flake(0) + "</svg>";
  }
  if (level === 2) {
    return open(52) + flake(0) + flake(28) + "</svg>";
  }
  return open(86) + flake(0) + flake(28) +
    '<path d="M71 3L84 22H58Z"/>' +
    '<path d="M71 10v6"/><path d="M71 19.2h.01"/></svg>';
}

function fmtHour(iso) {
  const d = new Date(iso);
  return d.getHours() + "h";
}

function fmtDay(d) {
  const w = d.toLocaleDateString("fr-FR", { weekday: "long" });
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  return w + " " + dd + "/" + mm;
}

function render() {
  if (!state.days.length) return;
  const tomorrow = state.days[0];
  const forecast = tomorrow.forecast;
  const risk = assessRisk(forecast);

  document.body.setAttribute("data-level", risk.level);

  const target = new Date(tomorrow.date); target.setHours(6, 0, 0, 0);
  const at6 = forecast.reduce(function (p, c) {
    return Math.abs(new Date(p.time) - target) < Math.abs(new Date(c.time) - target) ? p : c;
  });
  const d6 = at6.data.instant.details;
  const c6 = cloudOf(at6);
  const cloud = c6 !== undefined ? Math.round(c6) + "%" : "–";

  let strip = "";
  forecast.forEach(function (item) {
    const t = item.data.instant.details.air_temperature;
    strip += "<div>" + fmtHour(item.time) + "<b>" + t.toFixed(0) + "°</b></div>";
  });

  const dateText = tomorrow.date.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

  let daysHtml = "";
  for (let i = 1; i < state.days.length; i++) {
    const r = assessRisk(state.days[i].forecast);
    daysHtml += '<div class="day" data-level="' + r.level + '">' +
      "<span>" + fmtDay(state.days[i].date) + "</span>" +
      dayIcon(r.level) +
      '<span class="risk-text">' + LEVEL_LABELS[r.level] + "</span></div>";
  }
  const daysBlock = daysHtml
    ? '<div class="days-title">Les jours suivants</div><div class="days">' + daysHtml + "</div>"
    : "";

  document.getElementById("content").innerHTML =
    '<div class="hero">' +
      iconSvg(risk.level) +
      '<div class="when">' + dateText + " au matin</div>" +
      '<div class="verdict">' + VERDICTS[risk.level] + "</div>" +
      '<div class="credit">Votre surveillance givre propulsée par J. KIPPERT</div>' +
    "</div>" +
    '<div class="cards">' +
      '<div class="card-title">Prévision vers 6h</div>' +
      '<div class="card"><div class="label">Température</div><div class="value">' + d6.air_temperature.toFixed(1) + "°C</div></div>" +
      '<div class="card"><div class="label">Humidité</div><div class="value">' + Math.round(d6.relative_humidity) + "%</div></div>" +
      '<div class="card"><div class="label">Vent</div><div class="value">' + Math.round(d6.wind_speed * 3.6) + " km/h</div></div>" +
      '<div class="card"><div class="label">Nuages</div><div class="value">' + cloud + "</div></div>" +
    "</div>" +
    '<div class="strip">' + strip + "</div>" +
    daysBlock;
}

// ---------- Panneau de réglages ----------
function setupSheet() {
  const sheet = document.getElementById("sheet");
  const overlay = document.getElementById("overlay");

  function open() { sheet.classList.add("open"); overlay.classList.add("open"); markSelected(); }
  function close() { sheet.classList.remove("open"); overlay.classList.remove("open"); }
  function markSelected() {
    document.querySelectorAll(".opt").forEach(function (b) {
      b.classList.toggle("selected", b.getAttribute("data-env") === currentEnv);
    });
  }

  document.getElementById("envBtn").addEventListener("click", open);
  overlay.addEventListener("click", close);
  document.querySelectorAll(".opt").forEach(function (b) {
    b.addEventListener("click", function () {
      currentEnv = b.getAttribute("data-env");
      try { localStorage.setItem("givre_env", currentEnv); } catch (e) {}
      markSelected();
      updatePill();
      render();
      setTimeout(close, 200);
    });
  });
}
</script>
</body>
</html>
